name: "Build kernels"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"

on:
  workflow_dispatch:
  push:
    branches:
      - a32x-workflow-build
  pull_request:
    branches:
      - main

jobs:
  Set-repos:
    name: "Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - id: generate-matrix
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          cat ${{ env.CONFIGURATION }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "Build A32x full-permissive Codex kernel"
    runs-on: ubuntu-latest
    needs: [Set-repos]
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.device }}_defconfig
      withKernelSU: ${{ matrix.repos.withKernelSU }}
    steps:
      - name: Checkout builder configuration
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python3 libarchive-tools cpio xz-utils jq

      - name: Create working dir
        run: mkdir -p "$kernelDir"

      - name: Clone A32 kernel source
        working-directory: ./${{ env.kernelDir }}
        run: git clone --recursive --branch "$kernelBranch" "$kernelRepo" "$kernelName" --depth=1

      - name: Add MT7612U / ALFA AWUS036ACM driver and firmware
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/install_mt76x2u_backport.py" \
            --source-root . \
            --json-output "$GITHUB_WORKSPACE/${kernelDir}/mt7612u-backport.json"

      - name: Force persistent SELinux permissive mode
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/force_selinux_permissive.py" \
            --source-root . \
            --json-output "$GITHUB_WORKSPACE/${kernelDir}/selinux-permissive-patch.json"

      - name: Inject Codex Responses kernel capability bridge
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/install_codex_responses.py" \
            --source-root . \
            --payload-root "$GITHUB_WORKSPACE/codex/kernel"

      - name: Get toolchains
        working-directory: ./${{ env.kernelDir }}
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          toolchains_num="$(echo "$toolchains" | jq 'length')"
          for ((i=0;i<toolchains_num;i++)); do
            name=$(echo "$toolchains" | jq -r ".[$i].name")
            repo=$(echo "$toolchains" | jq -r ".[$i].repo")
            branch=$(echo "$toolchains" | jq -r ".[$i].branch")
            git clone --recursive --branch "$branch" "$repo" "$name" --depth=1
            echo "$(pwd)/$name/" >> $GITHUB_PATH
            echo "$(pwd)/$name/bin" >> $GITHUB_PATH
            clang_bin=$(find "$(pwd)/$name" -mindepth 2 -maxdepth 4 -type f -path "*/clang-r383902*/bin/clang" | sort | tail -n 1)
            if [ -z "$clang_bin" ]; then
              clang_bin=$(find "$(pwd)/$name" -mindepth 2 -maxdepth 4 -type f -path "*/bin/clang" | sort | tail -n 1)
            fi
            if [ -n "$clang_bin" ]; then echo "$(dirname "$clang_bin")" >> $GITHUB_PATH; fi
          done

      - name: Set kernel build args
        id: generate-args
        working-directory: ./${{ env.kernelDir }}
        env:
          params: "${{ toJSON(matrix.repos.params) }}"
          extraParams: "${{ toJSON(matrix.repos.extraParams) }}"
        run: |
          ARCH=$(echo "$params" | jq -r ".ARCH")
          CROSS_COMPILE=$(echo "$params" | jq -r ".CROSS_COMPILE")
          CROSS_COMPILE_COMPAT=$(echo "$params" | jq -r ".CROSS_COMPILE_COMPAT")
          CLANG_TRIPLE=$(echo "$params" | jq -r ".CLANG_TRIPLE")
          AR=$(echo "$params" | jq -r ".AR")
          CC=$(echo "$params" | jq -r ".CC")
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          args="-j$(nproc --all) O=$(pwd)/${OUT_DIR}"
          [ -n "$ARCH" ] && args="$args ARCH=$ARCH"
          [ -n "$CROSS_COMPILE" ] && args="$args CROSS_COMPILE=$CROSS_COMPILE"
          [ -n "$CLANG_TRIPLE" ] && args="$args CLANG_TRIPLE=$CLANG_TRIPLE"
          [ -n "$CROSS_COMPILE_COMPAT" ] && args="$args CROSS_COMPILE_ARM32=$CROSS_COMPILE_COMPAT"
          [ -n "$AR" ] && args="$args AR=$AR"
          [ -n "$CC" ] && args="$args CC=$CC"
          extra_params=$(echo "$extraParams" | jq -r 'to_entries[] | select(.value != "") | "\(.key)=\(.value)"' | tr '\n' ' ' | sed 's/ $//')
          echo "args=$args $extra_params" >> $GITHUB_OUTPUT

      - name: Add KernelSU v0.9.5
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        if: ${{ env.withKernelSU == 'true' }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          printf '\nCONFIG_KPROBES=y\nCONFIG_HAVE_KPROBES=y\nCONFIG_KPROBE_EVENTS=y\n' >> ./arch/${ARCH}/configs/${DEFCONFIG_NAME}

      - name: Make defconfig
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: make ${args} ${DEFCONFIG_NAME}

      - name: Enable and verify full open NetHunter configuration
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          config_path="$GITHUB_WORKSPACE/${kernelDir}/${OUT_DIR}/.config"
          required="$GITHUB_WORKSPACE/configs/a32x-nethunter-full.config"
          report="$GITHUB_WORKSPACE/${kernelDir}/config-validation.json"
          ./scripts/kconfig/merge_config.sh -m -O "$(dirname "$config_path")" "$config_path" "$required"
          make ${args} olddefconfig

          # The owner requires every disabled symbol from the resolved A32x
          # configuration to be requested as built-in, not only the curated
          # NetHunter fragment. Re-apply after Kconfig dependency resolution
          # so every satisfiable dependency chain reaches a fixed point.
          all_fragment="$GITHUB_WORKSPACE/${kernelDir}/all-configs-enable.config"
          all_requested="$GITHUB_WORKSPACE/${kernelDir}/all-configs-requested.txt"
          all_report="$GITHUB_WORKSPACE/${kernelDir}/all-configs-enable-report.json"
          python3 "$GITHUB_WORKSPACE/scripts/enable_all_kconfig.py" \
            --config "$config_path" --fragment "$all_fragment" --requested "$all_requested"
          for pass in 1 2 3 4; do
            ./scripts/kconfig/merge_config.sh -m -O "$(dirname "$config_path")" "$config_path" "$all_fragment"
            make ${args} olddefconfig
            if [ "$pass" -lt 4 ]; then
              python3 "$GITHUB_WORKSPACE/scripts/enable_all_kconfig.py" \
                --config "$config_path" --fragment "$all_fragment"
            fi
          done
          python3 "$GITHUB_WORKSPACE/scripts/enable_all_kconfig.py" \
            --config "$config_path" --requested "$all_requested" --json-output "$all_report"

          python3 "$GITHUB_WORKSPACE/scripts/validate_kernel_config.py" \
            --config "$config_path" --required "$required" --source-root . --json-output "$report"
          grep -qx 'CONFIG_CODEX_RESPONSES=y' "$config_path"

      - name: Upload resolved configuration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Config(${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }})
          path: |
            ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/.config
            ./${{ env.kernelDir }}/config-validation.json
            ./${{ env.kernelDir }}/mt7612u-backport.json
            ./${{ env.kernelDir }}/selinux-permissive-patch.json
            ./${{ env.kernelDir }}/all-configs-requested.txt
            ./${{ env.kernelDir }}/all-configs-enable.config
            ./${{ env.kernelDir }}/all-configs-enable-report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Build kernel
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: make ${args}

      - name: Verify forced persistent SELinux permissive mode
        working-directory: ./${{ env.kernelDir }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/verify_selinux_permissive_build.py" \
            --source-root "${kernelName}" --config "${OUT_DIR}/.config" \
            --image "${OUT_DIR}/arch/${ARCH}/boot/Image" \
            --patch-manifest "$GITHUB_WORKSPACE/${kernelDir}/selinux-permissive-patch.json" \
            --json-output "$GITHUB_WORKSPACE/${kernelDir}/selinux-permissive-build-evidence.json"

      - name: Verify MT7612U and Codex kernel bridge
        working-directory: ./${{ env.kernelDir }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/verify_mt76x2u_build.py" \
            --source-root "${kernelName}" --config "${OUT_DIR}/.config" --out-dir "${OUT_DIR}" \
            --image "${OUT_DIR}/arch/${ARCH}/boot/Image" \
            --json-output "$GITHUB_WORKSPACE/${kernelDir}/mt7612u-build-evidence.json"
          grep -a -q 'codex_responses' "${OUT_DIR}/arch/${ARCH}/boot/Image"
          grep -a -q 'codex_mt6360_set_torch' "${OUT_DIR}/arch/${ARCH}/boot/Image"

      - name: Upload SELinux permissive evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: SELinux-Permissive(${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }})
          path: |
            ./${{ env.kernelDir }}/selinux-permissive-patch.json
            ./${{ env.kernelDir }}/selinux-permissive-build-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload MT7612U evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MT7612U(${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }})
          path: |
            ./${{ env.kernelDir }}/mt7612u-backport.json
            ./${{ env.kernelDir }}/mt7612u-build-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image(${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }})
          path: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz(${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }})
          path: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz
          if-no-files-found: error
          retention-days: 7
